<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 计算器主体 -->
  <rect x="2" y="2" width="20" height="20" rx="2" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- 显示屏 -->
  <rect x="4" y="4" width="16" height="4" rx="1" fill="white" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- 按钮 -->
  <g>
    <!-- 加号按钮 -->
    <rect x="4" y="10" width="5" height="5" rx="1" fill="#87ceeb" />
    <circle cx="6.5" cy="11.5" r="0.5" fill="white" />
    <rect x="6" y="11.5" width="1" height="2" rx="0.5" fill="white" />
    
    <!-- 减号按钮 -->
    <rect x="11" y="10" width="5" height="5" rx="1" fill="#ffd700" />
    <rect x="12" y="12" width="3" height="1" rx="0.5" fill="white" />
    
    <!-- 乘号按钮 -->
    <rect x="4" y="16" width="5" height="5" rx="1" fill="#34495e" />
    <path d="M5,18.5 L7,18.5 L6,19.5 L5,18.5 L7,18.5 L6,17.5 Z" fill="white" />
    
    <!-- 等号按钮 -->
    <rect x="11" y="16" width="5" height="5" rx="1" fill="#e74c3c" />
    <rect x="12" y="17" width="3" height="1" rx="0.5" fill="white" />
    <rect x="12" y="19" width="3" height="1" rx="0.5" fill="white" />
  </g>
</svg>