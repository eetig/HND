<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- 储罐主体 -->
  <rect x="4" y="8" width="16" height="8" rx="1" fill="white" stroke="#333" stroke-width="1.5" />
  
  <!-- 椭圆封头 -->
  <ellipse cx="4" cy="12" rx="1" ry="4" fill="white" stroke="#333" stroke-width="1.5" />
  <ellipse cx="20" cy="12" rx="1" ry="4" fill="white" stroke="#333" stroke-width="1.5" />
  
  <!-- 液位线 -->
  <line x1="3" y1="10" x2="21" y2="10" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="2,1" />
  
  <!-- 直径标注 -->
  <line x1="12" y1="6" x2="12" y2="18" stroke="#333" stroke-width="1.5" />
  <line x1="11" y1="6" x2="13" y2="6" stroke="#333" stroke-width="1.5" />
  <line x1="11" y1="18" x2="13" y2="18" stroke="#333" stroke-width="1.5" />
  
  <!-- 顶部管口 -->
  <circle cx="8" cy="7" r="0.5" fill="#333" />
  <circle cx="12" cy="7" r="0.5" fill="#333" />
  <circle cx="16" cy="7" r="0.5" fill="#333" />
  
  <!-- 底部支座 -->
  <rect x="6" y="16" width="2" height="2" rx="0.5" fill="#333" />
  <rect x="16" y="16" width="2" height="2" rx="0.5" fill="#333" />
</svg>