<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 100 100">
  <!-- 时钟外框 -->
  <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="4" />
  
  <!-- 刻度 -->
  <g stroke="black" stroke-width="1">
    <!-- 小时刻度 -->
    <line x1="50" y1="10" x2="50" y2="15" stroke-width="2" />
    <line x1="85" y1="50" x2="80" y2="50" stroke-width="2" />
    <line x1="50" y1="85" x2="50" y2="80" stroke-width="2" />
    <line x1="15" y1="50" x2="10" y2="50" stroke-width="2" />
    
    <!-- 分钟刻度 -->
    <line x1="63" y1="18" x2="61" y2="20" />
    <line x1="77" y1="32" x2="75" y2="34" />
    <line x1="82" y1="47" x2="80" y2="49" />
    <line x1="77" y1="68" x2="75" y2="66" />
    <line x1="63" y1="82" x2="61" y2="80" />
    <line x1="37" y1="82" x2="39" y2="80" />
    <line x1="23" y1="68" x2="25" y2="66" />
    <line x1="18" y1="47" x2="20" y2="49" />
    <line x1="23" y1="32" x2="25" y2="34" />
    <line x1="37" y1="18" x2="39" y2="20" />
  </g>
  
  <!-- 数字 -->
  <g font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="black">
    <text x="50" y="20">12</text>
    <text x="83" y="54">3</text>
    <text x="50" y="90">6</text>
    <text x="17" y="54">9</text>
    <text x="69" y="27">1</text>
    <text x="79" y="42">2</text>
    <text x="79" y="68">4</text>
    <text x="69" y="83">5</text>
    <text x="31" y="83">7</text>
    <text x="21" y="68">8</text>
    <text x="21" y="42">10</text>
    <text x="31" y="27">11</text>
  </g>
  
  <!-- 时针 -->
  <line x1="50" y1="50" x2="35" y2="65" stroke="black" stroke-width="3" stroke-linecap="round" />
  
  <!-- 分针 -->
  <line x1="50" y1="50" x2="50" y2="25" stroke="black" stroke-width="2" stroke-linecap="round" />
  
  <!-- 秒针 -->
  <line x1="50" y1="50" x2="65" y2="75" stroke="red" stroke-width="1" stroke-linecap="round" />
  
  <!-- 中心点 -->
  <circle cx="50" cy="50" r="3" fill="red" />
</svg>